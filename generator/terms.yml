# 用語ガード：生成後のHTML本文（タグを除いた文字）に当てる辞書
# error = ビルドを止める / warn = 警告だけ
# 業務委託の募集で「雇用」と誤認させる言葉と、本部の表現ルールに反する言葉を止める
error:
  給与: 報酬
  月給: 報酬
  時給: 報酬
  手取り: 報酬（経費を引く前の金額）
  勤務時間: 稼働時間
  勤務地: 活動エリア
  勤務: 稼働
  出勤: 稼働
  シフト: 稼働予定
  入社: 契約開始
  社員: 職人
  休日休暇: 稼働しない日
  正社員: （使わない）
  雇用: （「雇用契約ではありません」の形以外では使わない）
  必ず稼げる: （使わない）
  誰でも稼げる: （使わない）
  確実に: （使わない）
  無理: 「自分のペースで」などに言い換える
  ダメ: 言い換える
  面接: 面談
  採用: 契約・募集
  月収: 月の報酬（試算）
  雇用形態: 契約形態
  安定した稼ぎ: 実績の幅と変動の理由を書く
  上司: 相談できる経験者
warn:
  スタッフ: 職人・委託パートナー
  先輩: 経験者
  定員: 受付枠（日付つき）
  直行直帰: 拠点に立ち寄らず現場へ
  ノルマなし: 「件数の決まりはありません」が誤解が少ない
  研修完備: 研修の中身（日数・件数）を書く
  年収: 年収モデルは前提（件数×日数×単価）とセットで
# 文脈上OKな言い回し（ここに書いた文字列は検査前に取り除く）
allow:
  - 雇用契約ではありません
  - 雇用契約とは異なります
  - 給与ではなく
  - 採用ではなく
